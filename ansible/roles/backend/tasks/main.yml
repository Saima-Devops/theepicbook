---
- name: Install prerequisites for Node.js
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Add NodeSource repository key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    mode: "0644"

- name: Add NodeSource Node.js repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_{{ node_major_version }}.x nodistro main"
    filename: nodesource
    state: present
    update_cache: true

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present

- name: Verify Node.js installation
  ansible.builtin.command: node --version
  register: node_version
  changed_when: false

- name: Display Node.js version
  ansible.builtin.debug:
    msg: "Node.js version: {{ node_version.stdout }}"

- name: Create EpicBook application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Clone or update EpicBook application
  ansible.builtin.git:
    repo: "{{ app_repository }}"
    dest: "{{ app_dir }}"
    version: "{{ app_branch }}"
    update: true
    force: true
  become: true
  become_user: "{{ app_user }}"
  notify: Restart EpicBook

- name: Install EpicBook production dependencies
  community.general.npm:
    path: "{{ app_dir }}"
    production: true
  become: true
  become_user: "{{ app_user }}"
  notify: Restart EpicBook

- name: Create EpicBook environment directory
  ansible.builtin.file:
    path: /etc/epicbook
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Create EpicBook production environment file
  ansible.builtin.copy:
    dest: /etc/epicbook/epicbook.env
    owner: root
    group: root
    mode: "0600"
    content: |
      NODE_ENV=production
      PORT={{ backend_app_port }}
      JAWSDB_URL=mysql://{{ mysql_user | urlencode }}:{{ mysql_password | urlencode }}@{{ mysql_host }}:{{ mysql_port }}/{{ mysql_database }}
  no_log: true
  notify: Restart EpicBook

- name: Create EpicBook systemd service
  ansible.builtin.template:
    src: epicbook.service.j2
    dest: /etc/systemd/system/epicbook.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart EpicBook

- name: Enable EpicBook service without starting it
  ansible.builtin.systemd:
    name: epicbook
    enabled: true
    state: stopped
    daemon_reload: true

