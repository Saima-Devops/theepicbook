trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  azureServiceConnection: "Azure subscription 1"
  terraformWorkingDirectory: "terraform"

  # Remote Terraform state
  terraformStateResourceGroup: "azure-devops"
  terraformStateStorageAccount: "epicbooktfstate6992"
  terraformStateContainer: "tfstate"
  terraformStateKey: "epicbook.tfstate"

stages:

# ============================================================
# Stage 1: Validate
# ============================================================
- stage: Validate
  displayName: "Validate Terraform"

  jobs:
    - job: ValidateTerraform
      displayName: "Terraform Format, Init and Validate"

      steps:

        - checkout: self

        # ----------------------------------------------------
        # Install Terraform
        # ----------------------------------------------------
        - task: TerraformInstaller@1
          displayName: "Install Terraform"
          inputs:
            terraformVersion: "latest"

        # ----------------------------------------------------
        # Terraform Format Check
        # ----------------------------------------------------
        - bash: |
            set -euo pipefail

            cd "$(terraformWorkingDirectory)"

            echo "Checking Terraform formatting..."

            terraform fmt -check -recursive

            echo "Terraform formatting validation successful."
          displayName: "Terraform Format Check"

        # ----------------------------------------------------
        # Terraform Init
        # ----------------------------------------------------
        - task: AzureCLI@2
          displayName: "Terraform Init"
          inputs:
            azureSubscription: "$(azureServiceConnection)"
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -euo pipefail

              cd "$(terraformWorkingDirectory)"

              echo "Initializing Terraform with Azure remote state..."

              terraform init \
                -backend-config="resource_group_name=$(terraformStateResourceGroup)" \
                -backend-config="storage_account_name=$(terraformStateStorageAccount)" \
                -backend-config="container_name=$(terraformStateContainer)" \
                -backend-config="key=$(terraformStateKey)" \
                -backend-config="use_azuread_auth=true"

              echo "Terraform initialization successful."

        # ----------------------------------------------------
        # Terraform Validate
        # ----------------------------------------------------
        - bash: |
            set -euo pipefail

            cd "$(terraformWorkingDirectory)"

            echo "Validating Terraform configuration..."

            terraform validate

            echo "Terraform validation successful."
          displayName: "Terraform Validate"


# ============================================================
# Stage 2: Plan
# ============================================================
- stage: Plan
  displayName: "Terraform Plan"

  dependsOn: Validate
  condition: succeeded()

  jobs:
    - job: TerraformPlan
      displayName: "Create Terraform Plan"

      steps:

        - checkout: self

        # ----------------------------------------------------
        # Install Terraform
        # ----------------------------------------------------
        - task: TerraformInstaller@1
          displayName: "Install Terraform"
          inputs:
            terraformVersion: "latest"

        # ----------------------------------------------------
        # Terraform Init
        # ----------------------------------------------------
        - task: AzureCLI@2
          displayName: "Terraform Init"
          inputs:
            azureSubscription: "$(azureServiceConnection)"
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -euo pipefail

              cd "$(terraformWorkingDirectory)"

              terraform init \
                -backend-config="resource_group_name=$(terraformStateResourceGroup)" \
                -backend-config="storage_account_name=$(terraformStateStorageAccount)" \
                -backend-config="container_name=$(terraformStateContainer)" \
                -backend-config="key=$(terraformStateKey)" \
                -backend-config="use_azuread_auth=true"

        # ----------------------------------------------------
        # Terraform Plan
        # ----------------------------------------------------
        - task: AzureCLI@2
          displayName: "Terraform Plan"
          inputs:
            azureSubscription: "$(azureServiceConnection)"
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -euo pipefail

              cd "$(terraformWorkingDirectory)"

              echo "Creating reviewed Terraform plan..."

              terraform plan \
                -out="$(Build.ArtifactStagingDirectory)/tfplan"

              echo "Terraform plan created successfully."

              terraform show \
                -no-color \
                "$(Build.ArtifactStagingDirectory)/tfplan" \
                > "$(Build.ArtifactStagingDirectory)/tfplan-summary.txt"

        # ----------------------------------------------------
        # Publish Plan Artifact
        # ----------------------------------------------------
        - task: PublishPipelineArtifact@1
          displayName: "Publish Terraform Plan"
          inputs:
            targetPath: "$(Build.ArtifactStagingDirectory)/tfplan"
            artifact: "terraform-plan"

        - task: PublishPipelineArtifact@1
          displayName: "Publish Terraform Plan Summary"
          inputs:
            targetPath: "$(Build.ArtifactStagingDirectory)/tfplan-summary.txt"
            artifact: "terraform-plan-summary"


# ============================================================
# Stage 3: Manual Approval
# ============================================================
- stage: Approval
  displayName: "Approve Terraform Apply"

  dependsOn: Plan
  condition: succeeded()

  jobs:
    - job: ManualApproval
      displayName: "Review Terraform Plan"
      pool: server

      timeoutInMinutes: 1440

      steps:

        - task: ManualValidation@1
          displayName: "Approve Infrastructure Deployment"
          timeoutInMinutes: 1440
          inputs:
            notifyUsers: ""
            instructions: |
              Review the Terraform plan generated by the Plan stage.

              Confirm that the planned infrastructure changes are expected
              before approving the deployment.

              The exact reviewed Terraform plan artifact will be used
              during the Apply stage.

              Approve this validation to continue with Terraform Apply.
            onTimeout: "reject"


# ============================================================
# Stage 4: Apply
# ============================================================
- stage: Apply
  displayName: "Terraform Apply"

  dependsOn: Approval
  condition: succeeded()

  jobs:
    - job: TerraformApply
      displayName: "Apply Reviewed Terraform Plan"

      steps:

        - checkout: self

        # ----------------------------------------------------
        # Install Terraform
        # ----------------------------------------------------
        - task: TerraformInstaller@1
          displayName: "Install Terraform"
          inputs:
            terraformVersion: "latest"

        # ----------------------------------------------------
        # Download the EXACT reviewed plan
        # ----------------------------------------------------
        - task: DownloadPipelineArtifact@2
          displayName: "Download Reviewed Terraform Plan"
          inputs:
            artifact: "terraform-plan"
            path: "$(Pipeline.Workspace)/terraform-plan"

        # ----------------------------------------------------
        # Terraform Init
        # ----------------------------------------------------
        - task: AzureCLI@2
          displayName: "Terraform Init"
          inputs:
            azureSubscription: "$(azureServiceConnection)"
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -euo pipefail

              cd "$(terraformWorkingDirectory)"

              terraform init \
                -backend-config="resource_group_name=$(terraformStateResourceGroup)" \
                -backend-config="storage_account_name=$(terraformStateStorageAccount)" \
                -backend-config="container_name=$(terraformStateContainer)" \
                -backend-config="key=$(terraformStateKey)" \
                -backend-config="use_azuread_auth=true"

        # ----------------------------------------------------
        # Apply EXACT reviewed plan
        # ----------------------------------------------------
        - task: AzureCLI@2
          displayName: "Terraform Apply"
          inputs:
            azureSubscription: "$(azureServiceConnection)"
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -euo pipefail

              cd "$(terraformWorkingDirectory)"

              PLAN_FILE="$(Pipeline.Workspace)/terraform-plan/tfplan"

              echo "Applying the exact reviewed Terraform plan..."

              terraform apply \
                -auto-approve \
                "$PLAN_FILE"

              echo "Terraform apply completed successfully."

              echo "Terraform outputs:"
              terraform output